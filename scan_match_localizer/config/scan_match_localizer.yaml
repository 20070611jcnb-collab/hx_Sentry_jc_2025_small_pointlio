scan_match_localizer:
  ros__parameters:
    # 固定先验地图由 nav2 map_server 发布，带 transient_local，节点晚启动也能拿到
    map_topic: /map
    scan_topic: /scan
    odom_topic: /Odometry

    # input_type: scan   -> 直接吃 LaserScan
    # input_type: cloud  -> 吃 point_lio 去畸变后的 /cloud_registered_full（推荐）
    # 原始 /scan 来自未去畸变的 /livox/lidar/pointcloud，高速/小陀螺时会歪，
    # 匹配会跟着歪，表现为“跑起来飘、停下恢复”。
    input_type: cloud
    cloud_topic: /cloud_registered_full
    cloud_z_min: 0.10      # base_footprint 下高度带，去掉地面
    cloud_z_max: 1.50
    cloud_body_radius: 0.45  # 去掉车体自身点

    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    # 启动时 map -> odom 的初值。仿真/固定起点用 [0, 0, 0]；
    # 实车若摆在已知点，可填入该点在 map 中的位姿。
    initial_map_to_odom: [0.0, 0.0, 0.0]

    tf_rate: 50.0
    # 未收敛（首次定位/失锁）时的大窗口重定位频率（Hz）
    reloc_rate: 2.0
    # 收敛后的局部跟踪频率（Hz）；map->odom 偏移变化很慢，不需要跟满雷达帧率
    max_scan_rate: 5.0

    # 扫描预处理
    max_scan_points: 500
    min_range: 0.15
    max_range: 10.0
    min_valid_points: 30

    # 距离场 / 评分
    occupied_threshold: 65
    max_distance: 1.0
    sigma_hit: 0.15
    inlier_distance: 0.25
    trim_ratio: 0.9
    prior_xy_weight: 0.25
    prior_yaw_weight: 0.15

    # 局部搜索（以 odom 先验为中心）
    search_xy: 0.25
    search_yaw: 0.1
    coarse_xy_step: 0.04
    coarse_yaw_step: 0.01
    fine_xy_radius: 0.06
    fine_yaw_radius: 0.015
    fine_xy_step: 0.01
    fine_yaw_step: 0.0025

    # 启动/失锁时的大范围捕获：收敛后自动切回上面的小窗口跟踪。
    # 车身隔一个身位（~0.5 m）也能在 1~2 帧内咬住。
    init_search_xy: 1.0
    init_search_yaw: 0.3
    init_coarse_xy_step: 0.08
    init_coarse_yaw_step: 0.02
    init_smoothing_alpha: 1.0

    # 足迹检查：避免“端点贴墙但车在墙里”的解
    robot_radius: 0.2
    footprint_penalty: 0.25

    # 接受门限。先用默认值跑，观察日志里的 score/inlier 再调。
    score_threshold: 0.4
    inlier_ratio_threshold: 0.4
    # 收敛后单帧修正限幅；防止一帧错误匹配把 map->odom 拉飞
    max_translation_correction: 0.10
    max_yaw_correction: 0.08

    # 收敛后若超过这个时间没有一帧匹配被接受（map->odom 停止更新），
    # 自动降级回上面的 init 大窗口重定位；重新稳定收敛后再切回精细匹配。
    reloc_trigger_timeout: 0.8

    # odom 时间戳出现空洞时，用最近一帧 odom 的 twist 外推到点云时刻；
    # 超过这个时长仍视为 odom 不可用，丢弃该帧。
    odom_extrapolate_max_dt: 0.5

    # 地形歧义（并排狗洞等相似结构）：最优与次优峰（位置相距 > ambiguity_min_distance）
    # 的得分差小于该值时，本帧不更新 map->odom，用 odom 先验顶住，避免锁到错洞。
    ambiguity_margin: 0.03
    ambiguity_min_distance: 0.4
    # 重定位阶段单次允许的最大修正。必须不小于初始捕获窗口
    # （init_search_xy + fine_xy_radius），否则真实的里程计漂移会被一直拒绝。
    # 相似地形的保护由上面的 ambiguity_margin 负责。
    reloc_max_prior_deviation: 1.2

    # 多帧一致性
    smoothing_alpha: 0.25
    # 小于这个量的修正视为栅格量化噪声，不更新 map->odom，避免抖动
    min_correction_xy: 0.03
    min_correction_yaw: 0.01
    converged_count: 3
    max_xy_spread: 0.12
    max_yaw_spread: 0.03

    # 调试输出
    publish_cloud: true
    publish_pose: true
    log_period: 1.0
